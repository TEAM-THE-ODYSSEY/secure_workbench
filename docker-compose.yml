services:

  # --- PostgreSQL + pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mrpl_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mrpl_rag
    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis (Celery broker & result backend) ---
  redis:
    image: redis:7-alpine
    container_name: mrpl_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO (Object / Document Storage) ---
  minio:
    image: minio/minio:latest
    container_name: mrpl_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ClamAV (Malware Scanner — optional) ---
  clamav:
    image: clamav/clamav:latest
    container_name: mrpl_clamav
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    profiles:
      - security  # Only starts with: docker compose --profile security up

  # --- FastAPI Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrpl_backend
    env_file: .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      uvicorn api.server:app --host 0.0.0.0 --port 8000 --reload

  # --- Celery Worker (Async Ingestion) ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrpl_worker
    env_file: .env.docker
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      celery -A rag.workers.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=ingestion,extraction,security,knowledge,embedding,indexing

volumes:
  pgdata:
  miniodata:
  clamavdata:
